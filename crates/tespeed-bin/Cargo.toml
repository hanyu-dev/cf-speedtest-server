[package]
name = "tespeed-bin"
version = "0.4.0-dev.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[[bin]]
name = "tespeed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = {
  version = "0.8.9",
  default-features = false,
  features = ["http1", "tokio"],
}
clap = {
  version = "4.6",
  default-features = false,
  features = ["color", "derive", "help", "std"],
}
fastrace = { version = "0.7.19", features = ["enable"] }
fastrace-axum = "0.2.0"
foldhash = "0.2.0"
log = { version = "0.4.34", features = ["kv"] }
logforth = {
  version = "0.30.1",
  features = ["append-fastrace", "bridge-log", "layout-text"],
}
memchr = "2.8"
sockext = { version = "0.1.0", registry = "hanyu" }
tespeed = { path = "../tespeed", version = "0.4.0-dev.0" }
tokio = {
  version = "1.53",
  features = ["macros", "parking_lot", "rt-multi-thread", "signal"],
}
wrapper-lite = "0.6.2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7.0"

[lints]
workspace = true
